name: Rust Tests

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Same matrix as the `verify` job in release.yml. CI has to cover every
  # supported platform up front: a Windows-only failure that only surfaces at
  # tag time blocks `cargo publish`, because release gates on that job.
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # Lint before building: both gates are cheap to satisfy and should fail the
      # run fast, instead of surfacing only after the whole test suite.
      - name: Check formatting
        run: cargo fmt --all --check

      # `-D clippy::pedantic` matches what is run locally before a PR is opened.
      # CI used to check only `-D warnings`, so a diff that passed here could
      # still be sent back by the local gate — and the discrepancy cost more
      # time to rediscover on each run than the lint ever saved. Keeping the two
      # identical means "green locally" and "green in CI" are the same claim.
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings -D clippy::pedantic

      - name: Build
        run: cargo build --verbose

      - name: Check
        run: cargo check --all

      - name: Test
        run: cargo test --verbose

      # The allocation budgets in `src/groups.rs` are the standing gate for
      # performance work: a named step, so a regression fails here with its own
      # line in the log instead of hiding among the ~30 tests above. `--release`
      # because an optimiser can fold away the very allocation a budget exists
      # to catch; the counts are currently identical in both profiles, so this
      # costs nothing and rules out the difference. The filter matches all four
      # budget tests by name.
      - name: Allocation budget
        run: cargo test --release --lib -- allocat --nocapture

      # Prints the exact counts those budgets only bound, in a greppable
      # `alloc op=... total=N` form. The test is `#[ignore]`d and asserts
      # nothing, so this step cannot fail the build; it exists so the current
      # numbers are already in the log of the latest run when a performance
      # issue is triaged, instead of having to be re-derived locally.
      - name: Allocation report
        run: cargo test --release --lib -- --ignored --nocapture

      # The README usage block is a verbatim copy of `shelve --help`. This
      # step fails the build if they have drifted apart, so a flag change
      # that forgets to update the README is caught before merge. Run
      # `scripts/update-readme-help.sh` locally to regenerate.
      # `shell: bash` because the step body is POSIX shell (command
      # substitution, `[ ]`, process substitution, awk). The Windows runner
      # default is PowerShell 7, which parses none of that; bash ships with
      # Git on all three OS images, so one script covers the whole matrix.
      - name: README help block
        shell: bash
        run: |
          # clap derives the usage line from argv[0], so on Windows the
          # binary prints `shelve.exe`; the README (and the help.txt golden)
          # use the bare `shelve`. Strip the suffix before comparing.
          ACTUAL="$(cargo run --quiet -- --help | sed 's/shelve\.exe/shelve/')"
          EXTRACTED="$(awk '/^## Usage$/{u=1} u&&/^```text$/{p=1;next} p&&/^```$/{p=0;u=0;next} p' README.md)"
          if [ "$ACTUAL" != "$EXTRACTED" ]; then
            echo "::error::README usage block does not match \`shelve --help\`"
            echo "Run scripts/update-readme-help.sh to regenerate."
            diff <(echo "$EXTRACTED") <(echo "$ACTUAL") || true
            exit 1
          fi
