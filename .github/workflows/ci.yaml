name: Rust Tests

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Same matrix as the `verify` job in release.yml. CI has to cover every
  # supported platform up front: a Windows-only failure that only surfaces at
  # tag time blocks `cargo publish`, because release gates on that job.
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # Lint before building: both gates are cheap to satisfy and should fail the
      # run fast, instead of surfacing only after the whole test suite.
      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Check
        run: cargo check --all

      - name: Test
        run: cargo test --verbose
