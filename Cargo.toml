[package]
name = "shelve"
version = "0.3.1"
edition = "2024"
description = "A simple command-line tool to pretty print CSV files grouped by a column"
license = "MIT"
repository = "https://github.com/matagus/shelve"
readme = "README.md"
keywords = ["csv", "cli", "grouping"]
categories = ["command-line-utilities", "text-processing"]
rust-version = "1.85"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.5.4", features = ["derive"] }
csv = "1.3.0"

[dev-dependencies]
assert_cmd = "2"
predicates = "2"
